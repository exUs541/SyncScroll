<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Scroll Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="header">
    <!-- Brand mark: mirrors the toolbar icon (two sliders linked by a sync arrow) -->
    <svg class="brand" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
      <rect width="36" height="36" rx="10" fill="#0066b1"/>
      <rect x="8.5" y="7" width="2" height="22" rx="1" fill="#fff" opacity=".5"/>
      <rect x="25.5" y="7" width="2" height="22" rx="1" fill="#fff" opacity=".5"/>
      <rect x="6" y="10" width="7" height="8" rx="2" fill="#fff"/>
      <rect x="23" y="18" width="7" height="8" rx="2" fill="#fff"/>
      <path d="M15.2 15.5h5.4m0 0-1.8-1.8m1.8 1.8-1.8 1.8M20.8 20.5h-5.4m0 0 1.8-1.8m-1.8 1.8 1.8 1.8"
            fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="heading">
      <h1 class="title">Sync Scroll Pro</h1>
      <p class="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status" aria-live="polite">Sync is on</span>
      </p>
    </div>

    <label class="switch" title="Turn sync on or off">
      <input type="checkbox" id="masterToggle" role="switch" aria-label="Enable Sync Scroll Pro" checked>
      <span class="slider"></span>
    </label>
  </header>

  <div class="segmented" role="group" aria-label="Sync mode">
    <span class="segment-thumb" aria-hidden="true"></span>
    <button class="segment-btn active" data-mode="global" aria-pressed="true">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="8" cy="8" r="6.25"/>
        <path d="M1.75 8h12.5M8 1.75c1.8 1.8 2.7 3.9 2.7 6.25S9.8 12.45 8 14.25C6.2 12.45 5.3 10.35 5.3 8S6.2 3.55 8 1.75Z"/>
      </svg>
      All tabs
    </button>
    <button class="segment-btn" data-mode="targeted" aria-pressed="false">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m2.25 4.25 1.25 1.25 2.25-2.5M2.25 10.75 3.5 12l2.25-2.5M8.5 4.75h5.25M8.5 11.25h5.25"/>
      </svg>
      Selected tabs
    </button>
  </div>

  <!-- Global mode -->
  <div id="view-global" class="view active">
    <div class="card">
      <!-- Purely decorative: two mini windows scrolling in lockstep -->
      <div class="demo" aria-hidden="true">
        <div class="mini">
          <span class="mini-bar"></span>
          <div class="mini-lines"><i class="h"></i><i></i><i class="s"></i><i></i><i class="h"></i><i class="s"></i><i></i><i></i><i class="h"></i><i class="s"></i><i></i><i></i></div>
          <span class="mini-thumb"></span>
        </div>
        <span class="demo-link">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </span>
        <div class="mini">
          <span class="mini-bar"></span>
          <div class="mini-lines"><i class="h"></i><i></i><i class="s"></i><i></i><i class="h"></i><i class="s"></i><i></i><i></i><i class="h"></i><i class="s"></i><i></i><i></i></div>
          <span class="mini-thumb"></span>
        </div>
      </div>
      <p class="note">
        <strong>All open tabs stay in step</strong>
        Scroll in one tab and every other tab follows. No setup needed.
      </p>
    </div>
  </div>

  <!-- Targeted mode -->
  <div id="view-targeted" class="view">
    <!-- Split view: suggestions for tabs shown side by side + the auto-sync setting.
         Only shown when the browser supports split view. -->
    <div id="splitSection" class="split-section" hidden>
      <div class="section-head">
        <h2 class="caption">Split view</h2>
      </div>
      <div class="card">
        <div id="splitPairs"></div>
        <label class="setting">
          <span class="setting-text">
            <strong>Auto-sync split view</strong>
            Side-by-side tabs scroll together.
          </span>
          <span class="switch">
            <input type="checkbox" id="autoSplitToggle" role="switch" aria-label="Auto-sync split view">
            <span class="slider"></span>
          </span>
        </label>
      </div>
    </div>

    <div class="section-head">
      <h2 class="caption">Tabs in this window</h2>
      <span class="badge" id="selCount" hidden>0 selected</span>
    </div>
    <ul id="tabList" class="list"></ul>
    <p class="hint" id="pairHint">Tick two or more tabs to link them.</p>
    <button class="primary-btn" id="pairBtn" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span id="pairLabel">Link tabs</span>
    </button>

    <div class="section-head">
      <h2 class="caption">Linked groups</h2>
      <span class="badge" id="groupCount" hidden>0</span>
    </div>
    <ul id="pairList" class="list"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
