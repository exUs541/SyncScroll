<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Scroll Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="header">
    <div>
      <h1 class="title">Sync Scroll Pro</h1>
      <p class="status" id="status" aria-live="polite">Sync is on</p>
    </div>
    <label class="switch" title="Turn sync on or off">
      <input type="checkbox" id="masterToggle" role="switch" aria-label="Enable Sync Scroll Pro" checked>
      <span class="slider"></span>
    </label>
  </header>

  <div class="segmented" role="group" aria-label="Sync mode">
    <button class="segment-btn active" data-mode="global" aria-pressed="true">All tabs</button>
    <button class="segment-btn" data-mode="targeted" aria-pressed="false">Selected tabs</button>
  </div>

  <!-- Global mode -->
  <div id="view-global" class="view active">
    <p class="note">
      <strong>All open tabs stay in step</strong>
      Scroll in one tab and every other tab follows. No setup needed.
    </p>
  </div>

  <!-- Targeted mode -->
  <div id="view-targeted" class="view">
    <h2 class="caption">Tabs in this window</h2>
    <ul id="tabList"></ul>
    <p class="hint" id="pairHint">Tick two or more tabs to link them.</p>
    <button class="primary-btn" id="pairBtn" disabled>Link tabs</button>

    <h2 class="caption">Linked groups</h2>
    <ul id="pairList"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
